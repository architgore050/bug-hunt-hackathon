name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- secrets ---
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 required: gitleaks-action v3 scans `oldest-PR-commit^..newest-PR-commit`
      # and the individual PR commits must exist in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (actions/checkout)
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 (gitleaks/gitleaks-action)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------- backend quality ----
  backend-quality:
    name: Backend quality (lint, format, security scans, dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (actions/checkout)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (actions/setup-python)
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies (runtime + dev/CI tools)
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .
      - name: Security lint (bandit, medium+ severity)
        run: bandit -q -r backend/app -ll
      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit

  # -------------------------------------------------------- backend tests -----
  backend-tests:
    name: Backend tests (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_DB: bughunt_test
      PGPORT: 5433
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73 # 17-alpine (Docker Hub)
        env:
          POSTGRES_USER: pgadmin
          POSTGRES_PASSWORD: ""
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pgadmin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (actions/checkout)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (actions/setup-python)
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      # Create database, roles and schemas on the CI service. Mirrors the
      # dev_db.sh grant block, but runs directly against the service: the CI
      # service is already up and trusts pgadmin.
      - name: Create database, roles and schemas
        run: |
          psql -h 127.0.0.1 -p 5433 -U pgadmin -d postgres -c "CREATE DATABASE $CI_DB"
          psql -h 127.0.0.1 -p 5433 -U pgadmin -d $CI_DB -f - <<'SQL'
          CREATE SCHEMA app; CREATE SCHEMA gt; CREATE SCHEMA audit;
          CREATE ROLE app_api LOGIN PASSWORD 'app_api_dev';
          CREATE ROLE gt_admin LOGIN PASSWORD 'gt_admin_dev';
          CREATE ROLE scheduler LOGIN PASSWORD 'scheduler_dev';
          GRANT USAGE ON SCHEMA app TO app_api, gt_admin, scheduler;
          GRANT CREATE ON SCHEMA app TO gt_admin;
          ALTER ROLE app_api SET search_path = app;
          ALTER ROLE gt_admin SET search_path = app, gt;
          ALTER ROLE scheduler SET search_path = app;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA app TO app_api, gt_admin, scheduler;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA app TO app_api, gt_admin, scheduler;
          GRANT USAGE ON SCHEMA gt TO gt_admin;
          GRANT CREATE ON SCHEMA gt TO gt_admin;
          GRANT SELECT ON ALL TABLES IN SCHEMA gt TO gt_admin;
          GRANT INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA gt TO gt_admin;
          GRANT USAGE ON SCHEMA audit TO app_api, gt_admin;
          GRANT INSERT, SELECT ON ALL TABLES IN SCHEMA audit TO app_api, gt_admin;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA audit TO app_api, gt_admin;
          ALTER DEFAULT PRIVILEGES IN SCHEMA app GRANT ALL ON TABLES TO app_api, gt_admin, scheduler;
          ALTER DEFAULT PRIVILEGES IN SCHEMA app GRANT ALL ON SEQUENCES TO app_api, gt_admin, scheduler;
          ALTER DEFAULT PRIVILEGES IN SCHEMA gt GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO gt_admin;
          ALTER DEFAULT PRIVILEGES IN SCHEMA audit GRANT INSERT, SELECT ON TABLES TO app_api, gt_admin;
          ALTER DEFAULT PRIVILEGES IN SCHEMA audit GRANT USAGE, SELECT ON SEQUENCES TO app_api, gt_admin;
          SQL
      - name: Apply migrations
        run: bash scripts/migrate.sh
        env:
          DB: bughunt_test
          PGUSER: pgadmin
      - name: Run backend tests with coverage
        run: |
          cd backend
          python -m pytest tests/ -q --cov=app --cov-fail-under=65 --timeout=120

  # ------------------------------------------------------------- backend e2e ---
  backend-e2e:
    name: Backend e2e journey (46 checks against the live stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73 # 17-alpine (Docker Hub)
        env:
          POSTGRES_USER: pgadmin
          POSTGRES_PASSWORD: ""
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pgadmin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_DB: bughunt
      PGPORT: 5433
      DATABASE_URL_APP: postgresql+psycopg://app_api:app_api_dev@127.0.0.1:5433/bughunt
      DATABASE_URL_GT: postgresql+psycopg://gt_admin:gt_admin_dev@127.0.0.1:5433/bughunt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (actions/checkout)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (actions/setup-python)
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Create database, roles and schemas
        run: |
          psql -h 127.0.0.1 -p 5433 -U pgadmin -d postgres -c "CREATE DATABASE $CI_DB"
          psql -h 127.0.0.1 -p 5433 -U pgadmin -d $CI_DB -f - <<'SQL'
          CREATE SCHEMA app; CREATE SCHEMA gt; CREATE SCHEMA audit;
          CREATE ROLE app_api LOGIN PASSWORD 'app_api_dev';
          CREATE ROLE gt_admin LOGIN PASSWORD 'gt_admin_dev';
          CREATE ROLE scheduler LOGIN PASSWORD 'scheduler_dev';
          GRANT USAGE ON SCHEMA app TO app_api, gt_admin, scheduler;
          GRANT CREATE ON SCHEMA app TO gt_admin;
          ALTER ROLE app_api SET search_path = app;
          ALTER ROLE gt_admin SET search_path = app, gt;
          ALTER ROLE scheduler SET search_path = app;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA app TO app_api, gt_admin, scheduler;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA app TO app_api, gt_admin, scheduler;
          GRANT USAGE ON SCHEMA gt TO gt_admin;
          GRANT CREATE ON SCHEMA gt TO gt_admin;
          GRANT SELECT ON ALL TABLES IN SCHEMA gt TO gt_admin;
          GRANT INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA gt TO gt_admin;
          GRANT USAGE ON SCHEMA audit TO app_api, gt_admin;
          GRANT INSERT, SELECT ON ALL TABLES IN SCHEMA audit TO app_api, gt_admin;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA audit TO app_api, gt_admin;
          ALTER DEFAULT PRIVILEGES IN SCHEMA app GRANT ALL ON TABLES TO app_api, gt_admin, scheduler;
          ALTER DEFAULT PRIVILEGES IN SCHEMA app GRANT ALL ON SEQUENCES TO app_api, gt_admin, scheduler;
          ALTER DEFAULT PRIVILEGES IN SCHEMA gt GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO gt_admin;
          ALTER DEFAULT PRIVILEGES IN SCHEMA audit GRANT INSERT, SELECT ON TABLES TO app_api, gt_admin;
          ALTER DEFAULT PRIVILEGES IN SCHEMA audit GRANT USAGE, SELECT ON SEQUENCES TO app_api, gt_admin;
          SQL
      - name: Apply migrations
        run: bash scripts/migrate.sh
        env:
          DB: bughunt
          PGUSER: pgadmin
      - name: Seed demo data
        run: |
          cd backend
          python seed.py --reset
      - name: Start API and worker
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8100 > /tmp/api.log 2>&1 &
          python worker.py > /tmp/worker.log 2>&1 &
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            curl -f http://127.0.0.1:8100/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "API did not become healthy" >&2
          tail -n 50 /tmp/api.log
          exit 1
      - name: Run e2e journey (exits nonzero on any failure, see docstring in scripts/e2e_journey.py)
        run: python scripts/e2e_journey.py
        # the journey script itself exits nonzero on failure

  # ---------------------------------------------------------- frontend ----
  frontend-quality:
    name: Frontend quality (audit, build, placeholder gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (actions/checkout)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (actions/setup-node)
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Dependency vulnerability audit (npm, high+)
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Frontend rendering regression tests
        run: npm test
        working-directory: frontend
      - name: Build frontend (tsc -b && vite build)
        run: npm run build
        working-directory: frontend

  # ---------------------------------------------------------- docs hygiene ----
  # Em dashes are banned in docs and user-facing source (design-system rule).
  # The placeholder ban covers platform code only: the challenge-app is a
  # separate vendor product (Papyrus) and keeps its own documented TODO.
  docs-hygiene:
    name: Docs and source hygiene (em dash ban, placeholder ban)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (actions/checkout)
      - name: No em dashes (docs, frontend, backend, scripts)
        run: |
          ! grep -rn --binary-files=without-match "—" docs/ frontend/src/ backend/app/ backend/tests/ backend/seed.py backend/worker.py backend/migrations/ scripts/ README.md AGENTS.md 2>/dev/null
      - name: No TODO/Lorem/XXX in platform code
        run: |
          ! grep -rnE "TODO|Lorem|XXX" frontend/src/ backend/app/ backend/tests/ backend/seed.py backend/worker.py backend/migrations/ scripts/
